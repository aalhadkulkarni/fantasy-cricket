<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Fantasy League</title>
  <defs>
    <radialGradient id="leather" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#f0484a" />
      <stop offset="0.55" stop-color="#c8161d" />
      <stop offset="1" stop-color="#7a0a0f" />
    </radialGradient>
    <clipPath id="ball">
      <circle cx="32" cy="32" r="29" />
    </clipPath>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#leather)" />
  <g clip-path="url(#ball)" fill="none" stroke-linecap="round">
    <!-- The seam: two curved lines, stitched -->
    <path d="M19 2 C 29 20, 35 42, 44 63" stroke="#7a0a0f" stroke-width="7" />
    <path d="M19 2 C 29 20, 35 42, 44 63" stroke="#f6efe2" stroke-width="2.6" stroke-dasharray="3.2 2.6" transform="translate(-2.6 0.8)" />
    <path d="M19 2 C 29 20, 35 42, 44 63" stroke="#f6efe2" stroke-width="2.6" stroke-dasharray="3.2 2.6" transform="translate(2.6 -0.8)" />
  </g>
  <!-- A soft highlight, so it reads as a ball rather than a disc -->
  <ellipse cx="15" cy="24" rx="5.5" ry="4" fill="#ffffff" opacity="0.22" transform="rotate(-35 15 24)" />
</svg>
