name: Deploy to Firebase Hosting on merge to release
on:
  push:
    branches:
      - release
    # The API deploys from its own workflow; a server-only change should not
    # rebuild and redeploy the site.
    paths-ignore:
      - 'apps/api/**'
      - '.github/workflows/api-deploy.yml'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FANTASY_CRICKET_LEAGUE_C0346 }}
          channelId: live
          projectId: fantasy-cricket-league-c0346
